[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biased-generalization"
version = "1.0.0"
description = "Code for Biased Generalization in Diffusion Models"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib>=3.7",
    "natsort>=8",
    "numba>=0.58",
    "numpy>=1.24",
    "pillow>=9",
    "pytorch-fid==0.3.0",
    "pywavelets>=1.4",
    "scipy>=1.10",
    "seaborn>=0.12",
    "setuptools>=69",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.65",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["modules*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
